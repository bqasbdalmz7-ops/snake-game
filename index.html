<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>لعبة الدودة 🐍</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    padding: 16px;
    touch-action: manipulation;
  }

  h1 {
    margin-bottom: 12px;
    font-size: 28px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }

  .hud {
    display: flex;
    gap: 20px;
    margin-bottom: 12px;
    font-size: 18px;
  }

  .hud span b { color: #ffd166; }

  .board {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }

  canvas {
    display: block;
    background: #1b2735;
    max-width: 92vw;
    height: auto;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 20, 30, .85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }

  .overlay.hidden { display: none; }

  .overlay h2 { font-size: 26px; }
  .overlay p { font-size: 16px; color: #cfd8dc; line-height: 1.7; }

  button {
    font-family: inherit;
    font-size: 18px;
    padding: 10px 32px;
    border: none;
    border-radius: 8px;
    background: #ffd166;
    color: #203a43;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }

  button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 16px rgba(255, 209, 102, .4);
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 8px;
    margin-top: 18px;
    direction: ltr;
  }

  .controls button {
    font-size: 22px;
    padding: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.12);
    color: #fff;
  }

  .controls button:hover { background: rgba(255,255,255,.25); }

  .controls .up    { grid-column: 2; grid-row: 1; }
  .controls .left  { grid-column: 1; grid-row: 2; }
  .controls .down  { grid-column: 2; grid-row: 2; }
  .controls .right { grid-column: 3; grid-row: 2; }

  @media (min-width: 800px) {
    .controls { display: none; }
  }
</style>
</head>
<body>

<h1>🐍 لعبة الدودة</h1>

<div class="hud">
  <span>النقاط: <b id="score">0</b></span>
  <span>أعلى نتيجة: <b id="highScore">0</b></span>
</div>

<div class="board">
  <canvas id="game" width="480" height="480"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlayTitle">لعبة الدودة 🐍</h2>
    <p id="overlayText">استخدم أسهم لوحة المفاتيح أو أزرار الاتجاه أو اسحب على الشاشة للتحكم.<br>كُل التفاح وتجنّب الاصطدام!</p>
    <button id="startBtn">ابدأ اللعب</button>
  </div>
</div>

<div class="controls">
  <button class="up"    data-dir="up">▲</button>
  <button class="left"  data-dir="left">◀</button>
  <button class="down"  data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const GRID = 24;
  const CELL = canvas.width / GRID;
  const BASE_SPEED = 150;

  let snake, direction, nextDirection, food, score, highScore, speed, timer, state;

  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function resetGame() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    direction = { x: 1, y: 0 };
    nextDirection = direction;
    score = 0;
    speed = BASE_SPEED;
    scoreEl.textContent = '0';
    placeFood();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function startGame() {
    resetGame();
    overlay.classList.add('hidden');
    state = 'playing';
    scheduleTick();
  }

  function scheduleTick() {
    clearTimeout(timer);
    timer = setTimeout(tick, speed);
  }

  function tick() {
    direction = nextDirection;
    const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

    if (
      head.x < 0 || head.x >= GRID ||
      head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(70, BASE_SPEED - score * 3);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
    scheduleTick();
  }

  function gameOver() {
    state = 'over';
    clearTimeout(timer);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', String(highScore));
      highScoreEl.textContent = highScore;
    }
    overlayTitle.textContent = 'انتهت اللعبة! 💀';
    overlayText.innerHTML = 'نتيجتك: <b>' + score + '</b>' +
      (score >= highScore && score > 0 ? ' — رقم قياسي جديد! 🏆' : '');
    startBtn.textContent = 'العب مرة أخرى';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,.04)';
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((seg, i) => {
      const t = 1 - i / (snake.length * 1.5);
      ctx.fillStyle = i === 0 ? '#a3e635' : 'rgba(74, 222, 128,' + Math.max(t, 0.35) + ')';
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    });

    const head = snake[0];
    ctx.fillStyle = '#052e16';
    const eye = CELL * 0.18;
    const cx = head.x * CELL + CELL / 2;
    const cy = head.y * CELL + CELL / 2;
    const ox = direction.x * CELL * 0.18;
    const oy = direction.y * CELL * 0.18;
    ctx.beginPath();
    ctx.arc(cx + ox - 4, cy + oy - 4, eye, 0, Math.PI * 2);
    ctx.arc(cx + ox + 4, cy + oy + 4, eye, 0, Math.PI * 2);
    ctx.fill();
  }

  function setDirection(dir) {
    const map = {
      up:    { x: 0, y: -1 },
      down:  { x: 0, y: 1 },
      left:  { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const d = map[dir];
    if (!d) return;
    if (d.x === -direction.x && d.y === -direction.y) return;
    nextDirection = d;
  }

  document.addEventListener('keydown', function (e) {
    const keys = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };
    if (keys[e.key]) {
      e.preventDefault();
      setDirection(keys[e.key]);
    }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (state !== 'playing') startGame();
    }
  });

  document.querySelectorAll('.controls [data-dir]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setDirection(btn.dataset.dir);
    });
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 'right' : 'left');
    } else {
      setDirection(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  startBtn.addEventListener('click', startGame);

  resetGame();
  draw();
})();
</script>
</body>
</html>
